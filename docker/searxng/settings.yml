# SearXNG for local development: the agent's web_search tool queries its JSON
# API. Published on host loopback only (compose.yml).
use_default_settings: true
server:
  # Dev only: the instance is bound to 127.0.0.1 and holds no user data.
  secret_key: "hypo-agent-dev-only-not-a-secret"
  limiter: false
  image_proxy: false
search:
  formats: [html, json]
outgoing:
  # DuckDuckGo regularly needs more than the 3 s default.
  request_timeout: 6.0
# Several independent engines, so one engine rate-limiting this IP doesn't
# empty the results. Google CSE gets suspended under agent query volume.
engines:
  - name: brave
    disabled: false
  - name: bing
    disabled: false
  - name: google
    disabled: false
  - name: qwant
    disabled: false
  - name: yahoo
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: google cse
    disabled: true
