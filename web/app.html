<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Apply dark mode before first paint (Laravel does this server-side from a cookie). -->
    <script>
      (function () {
        var a = localStorage.getItem("appearance") || "system";
        if (a === "dark" || (a === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html { background-color: oklch(1 0 0); }
      html.dark { background-color: oklch(0.145 0 0); }
    </style>

    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600" rel="stylesheet" />

    <title>Hypo Agent</title>
    {{ .inertiaHead }}
    {{ reactRefresh }}
    {{ viteAssets "src/app.css" "src/app.tsx" }}
  </head>
  <body class="font-sans antialiased">
    {{ .inertia }}
  </body>
</html>
