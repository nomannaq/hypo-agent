name: hypo
services:
  db:
    image: pgvector/pgvector:pg17
    env_file: .env
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypo -d hypo"]
      interval: 2s
      retries: 30

  # Temporal gets its own databases (temporal, temporal_visibility) on this
  # same Postgres instance — no second database engine to run.
  temporal:
    image: temporalio/auto-setup:1.24.2
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: db
    ports: ["7233:7233"]

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8088:8080"] # 8080 is cmd/server

  # Headless browser for the agent's browse tool (CDP). Its SSRF guard blocks
  # private addresses, so pages can't reach db or temporal on this network.
  obscura:
    image: h4ckf0r0day/obscura:0.2.7
    command: ["serve", "--host", "0.0.0.0", "--port", "9222"]
    environment:
      OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN:?set OBSCURA_CDP_TOKEN in .env (openssl rand -hex 32)}
    ports: ["127.0.0.1:9222:9222"]

  # Metasearch for the agent's web_search tool (JSON API, no key).
  searxng:
    image: searxng/searxng:2026.11.20-cd6d28091
    volumes: ["./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro"]
    ports: ["127.0.0.1:8888:8080"]
volumes:
  pgdata:
